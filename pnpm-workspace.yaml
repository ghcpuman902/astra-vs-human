# pnpm 11 blocks dependency build scripts unless explicitly allowed/denied.
# Pre-approve here so fresh clones (and agent sandboxes) can `pnpm install` + `pnpm dev`
# without an interactive `pnpm approve-builds` step.
allowBuilds:
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.0'
  - '@next/eslint-plugin-next@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - eslint-config-next@16.4.0
  - next@16.4.0
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
